<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qosmos">
<meta name="theme-color" content="#181818">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>Qosmos</title>
<style>
  :root, :root[data-theme="antrasit"] {
    --bg: #181818; --side: #141414; --card: #232323; --bubble: #232323; --seg-on: #2f2f2f; --seg-shadow: none; --line: #262626; --text: #d4d4d4; --text2: #a3a3a3; --dim: #7a7a7a;
    --hover: rgba(255,255,255,.045); --sel: rgba(255,255,255,.085); --btn: #262626; --btn-hover: #2f2f2f;
    --input: #212121; --input-line: #333; --round: #e8e8e8; --round-fg: #141414; --toast: #262626; --seg: #1d1d1d;
    --red: #f14c4c; --orange: #e8a33d; --blue: #4d9bf0; --grey: #6f6f6f;
    --sky: #181818; --orbit: #2a2a2a; --mline: #444; --planet: #e4e4e4; --planet-dim: #8f8f8f; --planet-text: #181818; --label: #a8a8a8; --ring: #ffffff;
    --thumb: rgba(255,255,255,.12);
  }
  :root[data-theme="acik"] {
    --bg: #fbfbfb; --side: #dedee1; --card: #ffffff; --bubble: #ececef; --seg-on: #ffffff; --seg-shadow: 0 1px 2px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.08); --line: #e4e4e6; --text: #1f1f22; --text2: #4a4a50; --dim: #8a8a90;
    --hover: rgba(0,0,0,.04); --sel: rgba(0,0,0,.07); --btn: #ececee; --btn-hover: #e2e2e5;
    --input: #ffffff; --input-line: #dcdcdf; --round: #1f1f22; --round-fg: #fff; --toast: #ffffff; --seg: rgba(0,0,0,.07);
    --red: #d9161e; --orange: #d47800; --blue: #1a73e8; --grey: #a8a8ae;
    --sky: #f3f3f4; --orbit: #dedee2; --mline: #c4c4ca; --planet: #3b3b40; --planet-dim: #8b8b92; --planet-text: #fff; --label: #55555b; --ring: #1f1f22;
    --thumb: rgba(0,0,0,.15);
  }
  :root[data-theme="siyah"] {
    --bg: #000; --side: #060606; --card: #161616; --bubble: #161616; --seg-on: #242424; --seg-shadow: none; --line: #1c1c1c; --text: #e2e2e2; --text2: #a8a8a8; --dim: #777;
    --hover: rgba(255,255,255,.05); --sel: rgba(255,255,255,.09); --btn: #1a1a1a; --btn-hover: #242424;
    --input: #111; --input-line: #2a2a2a; --round: #e8e8e8; --round-fg: #000; --toast: #1a1a1a; --seg: #0e0e0e;
    --red: #ff3030; --orange: #ff9a20; --blue: #4da3ff; --grey: #707070;
    --sky: #000; --orbit: #1d1d1d; --mline: #3a3a3a; --planet: #fff; --planet-dim: #9a9a9a; --planet-text: #000; --label: #bbb; --ring: #fff;
    --thumb: rgba(255,255,255,.12);
  }

  /* An app, not a page: no text selection in the chrome, no hand cursor, no rubber-band scroll. */
  :root { --spring: cubic-bezier(.34, 1.56, .64, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; cursor: default; }
  textarea, select, .selectable, .selectable * { -webkit-user-select: text; user-select: text; }
  textarea { cursor: text; }
  button, select, textarea { font: inherit; color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 1.5px solid var(--blue); outline-offset: 1px; border-radius: 6px; }
  .cbox :focus-visible { outline: none; }
  .scroll { overflow: auto; }
  .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .dim { color: var(--dim); }
  .red { color: var(--red); }
  svg.i { width: 14px; height: 14px; flex: none; }

  /* Buttons: quiet, fixed height, no borders — like a desktop toolbar. */
  .btn { height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: var(--btn); color: var(--text2); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--btn-hover); color: var(--text); }
  .btn.danger:hover { color: var(--red); }
  .btn:disabled { opacity: .45; }
  .icon { width: 24px; height: 24px; border: 0; border-radius: 6px; background: none; color: var(--dim); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .icon:hover { background: var(--hover); color: var(--text); }
  .seg { display: inline-flex; background: var(--seg); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { height: 22px; padding: 0 9px; border: 0; border-radius: 5px; background: none; color: var(--dim); font-size: 11.5px; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--seg-on); color: var(--text); box-shadow: var(--seg-shadow); }

  #app { display: flex; height: 100vh; }
  #side { width: var(--side-w, 272px); flex: none; position: relative; }
  #plist { width: 0; flex: none; overflow: hidden; display: flex; flex-direction: column; min-height: 0; background: var(--bg); border-right: 1px solid transparent; transition: width .16s ease; }
  #plist { position: relative; }
  #plist.open { width: var(--plist-w, 320px); border-right-color: var(--line); }
  #plist > header { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  #plist > header .title { flex: 1; font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
  #plist .meta { padding: 10px 16px 4px; white-space: nowrap; }
  #plist .body { flex: 1; min-height: 0; padding: 4px 8px 12px; width: var(--plist-w, 320px); }
  /* the panel ends on a footer level with the columns' composers, so the list never seems to run off the window */
  .pfoot { flex: none; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 12px; min-height: 92px; border-top: 1px solid var(--line); width: var(--plist-w, 320px); }
  .item.on { background: var(--sel); }
  .item .sub.orange { color: var(--orange); }
  #main { flex: 1; }
  /* when the map is the first column it docks right of the sidebar, before the project panel */
  #mapdock { display: flex; flex: none; min-height: 0; overflow: hidden; }
  #mapdock > .col { border-right: 1px solid var(--line); }

  /* Sidebar */
  #side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
  #brand { display: flex; align-items: center; gap: 10px; padding: 14px 14px 2px; }
  #brand img { border-radius: 7px; flex: none; }
  #brand .bname { font-size: 15px; font-weight: 650; letter-spacing: .2px; color: var(--text); line-height: 1.2; }
  #brand .btag { font-size: 11.5px; color: var(--dim); line-height: 1.3; }
  #head { padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  #counts { display: flex; gap: 12px; font-size: 12px; color: var(--text2); }
  #counts b { font-weight: 600; }
  #counts .w b { color: var(--red); }
  #counts .o b { color: var(--orange); }
  .section { font-size: 11.5px; color: var(--dim); padding: 12px 10px 4px; }
  #tree { flex: 1; min-height: 60px; padding: 0 6px 8px; }
  .row { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; color: var(--text2); white-space: nowrap; }
  .row:hover { background: var(--hover); color: var(--text); }
  .row.on { background: var(--sel); color: var(--text); }
  .row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .row.proj .name { color: var(--text); }
  .row.sub { padding-left: 26px; }
  .row.proj { touch-action: none; }
  .group { display: flex; flex-direction: column; gap: 4px; padding: 0 2px; }
  /* project bars share the composer's box: same height, corners, fill and border */
  .group .row { height: 38px; font-size: 14px; padding: 0 14px; gap: 10px; background: var(--input); border: 1px solid var(--input-line); border-radius: 16px; box-shadow: none; }
  .group .row:hover { background: color-mix(in srgb, var(--input), var(--text) 5%); }
  .group .row.on { background: color-mix(in srgb, var(--input), var(--text) 9%); border-color: color-mix(in srgb, var(--input-line), var(--text) 30%); }
  :root[data-theme="acik"] #side .group .row.proj.on { background: #ffffff; }
  .group .row.sw, .item.sw { box-shadow: inset 3px 0 0 var(--red); }
  .group .row.sr, .item.sr { box-shadow: inset 3px 0 0 var(--orange); }
  #side .group .row { border: 0; box-shadow: none; }
  .item { background: var(--card); border: 1px solid var(--input-line); border-radius: 16px; margin: 0 0 6px; box-shadow: 0 1px 0 rgba(0,0,0,.22); }
  .item:hover { background: var(--btn-hover); }
  .rz { position: absolute; top: 0; right: -3px; width: 7px; height: 100%; cursor: col-resize; z-index: 20; }
  /* VS Code-style sash: a three-dot grip in the middle, a blue line on hover and while dragging */
  .rz::before { content: ''; position: absolute; left: 2px; top: 50%; width: 3px; height: 15px; transform: translateY(-50%);
    background: radial-gradient(circle, var(--dim) 1.1px, transparent 1.5px) 0 0 / 3px 5px repeat-y; opacity: .9; z-index: 1; }
  .rz::after { content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 3px; background: transparent; transition: background .12s .08s; }
  .rz:hover::after, .rz.on::after { background: var(--blue); }
  .rz:hover::before, .rz.on::before { opacity: 0; }
  body.resizing, body.resizing * { cursor: col-resize !important; }
  body.resizing #plist { transition: none; }
  .col > header { cursor: default; touch-action: none; }
  .col-shift { transition: transform .36s var(--spring); }
  .col-hole { visibility: hidden; }
  .col-ghost { position: fixed; z-index: 60; pointer-events: none; display: flex; flex-direction: column; overflow: hidden; background: var(--bg);
    border: 1px solid var(--input-line); border-radius: 10px; transform: rotate(var(--tilt, 0deg)) scale(1); transition: transform .14s ease, box-shadow .14s ease; }
  .col-ghost .rz { display: none; }
  .col-ghost.lifted { transform: rotate(var(--tilt, 0deg)) scale(1.015); box-shadow: 0 22px 48px rgba(0,0,0,.40), 0 4px 12px rgba(0,0,0,.25); transition: transform .08s ease-out, box-shadow .14s ease; }
  .col-ghost.settle { transition: left .34s var(--spring), top .34s var(--spring), transform .18s ease, box-shadow .18s ease; }
  .group .row .badge { font-size: 11.5px; min-width: 19px; height: 19px; border-radius: 10px; }
  .group .row .dot { width: 8px; height: 8px; }
  .group .row .age { font-size: 12px; }
  /* the numbers sit flush right; ⋯ takes no room and shows over them only on hover or when the row is selected */
  .group .row { position: relative; }
  .group .row .more { visibility: hidden; position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border: 0; border-radius: 8px; background: inherit; color: var(--text2); display: inline-flex; align-items: center; justify-content: center; }
  .group .row:hover .more, .group .row.on .more, .group .row .more.open { visibility: visible; }
  .group .row .more:hover, .group .row .more.open { background: color-mix(in srgb, var(--input), var(--text) 12%); color: var(--text); }
  .drag-shift { transition: transform .32s var(--spring); }
  .drag-hole { visibility: hidden; }
  .drag-ghost { position: fixed; z-index: 60; pointer-events: none; margin: 0; background: var(--btn-hover); color: var(--text); border-radius: 7px; outline: 1px solid var(--input-line); outline-offset: -1px;
    transform: rotate(var(--tilt, 0deg)) scale(1); box-shadow: 0 0 0 rgba(0,0,0,0);
    transition: transform .14s ease, box-shadow .14s ease; }
  .drag-ghost.lifted { transform: rotate(var(--tilt, 0deg)) scale(1.035); box-shadow: 0 12px 28px rgba(0,0,0,.38), 0 3px 8px rgba(0,0,0,.25); transition: transform .08s ease-out, box-shadow .14s ease; }
  .drag-ghost.settle { transition: left .3s var(--spring), top .3s var(--spring), transform .16s ease, box-shadow .16s ease; }
  body.grabbing, body.grabbing * { cursor: grabbing !important; }
  .section { display: flex; align-items: center; }
  .linkbtn { margin-left: auto; border: 0; background: none; color: var(--dim); font-size: 11px; padding: 0 4px; }
  .linkbtn:hover { color: var(--text); }
  .row .age { font-size: 11px; color: var(--dim); }
  .row .chev { width: 12px; color: var(--dim); display: inline-flex; }
  .badge { font-size: 10.5px; min-width: 16px; height: 16px; padding: 0 5px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; background: var(--btn); color: var(--dim); }
  .badge.r { background: color-mix(in srgb, var(--red) 72%, transparent); color: #fff; }
  .badge.o { background: transparent; color: var(--orange); box-shadow: inset 0 0 0 1px var(--orange); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--grey); }
  .dot.r { background: var(--red); animation: blink 1s infinite; }
  .dot.o { background: var(--orange); }
  .dot.b { background: var(--blue); }
  .dot.u { box-shadow: 0 0 0 1.5px var(--ring); background: transparent; }
  @keyframes blink { 50% { opacity: .25; } }
  svg [data-k], svg [data-p] { cursor: pointer; }

  /* Composer — one look for every bar */
  /* the composer copies Claude's own bar: + on the left, the mic on the right, a send circle once there is text,
     and a quiet row underneath with the session's mode, model and effort */
  .composer { flex: none; padding: 10px 12px 8px; }
  .cbox { display: flex; align-items: center; gap: 6px; background: var(--input); border: 1px solid var(--input-line); border-radius: 18px; padding: 6px 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .cbox:focus-within { border-color: color-mix(in srgb, var(--input-line), var(--text) 22%); }
  .cbox textarea { flex: 1; resize: none; background: none; border: 0; padding: 6px 2px; min-height: 22px; max-height: 160px; line-height: 1.45; color: var(--text); font-size: 14px; }
  .cbox .plus, .cbox .micbtn { width: 30px; height: 30px; border: 0; border-radius: 50%; background: none; color: var(--text2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .cbox .plus:hover, .cbox .micbtn:hover { background: var(--hover); color: var(--text); }
  .cbox .plus svg.i, .cbox .micbtn svg.i { width: 18px; height: 18px; }
  .cbox .round { display: none; }
  .composer.has-text .cbox .round { display: inline-flex; }
  .composer.has-text .cbox .micbtn { display: none; }
  .composer.rec .cbox .micbtn { display: inline-flex; color: #fff; background: var(--red); animation: blink 1.2s infinite; }
  .cmeta .chip { border: 0; background: none; color: var(--text2); font-size: 12.5px; height: 22px; padding: 0 6px; border-radius: 6px; white-space: nowrap; }
  .cmeta .chip:hover { background: var(--hover); color: var(--text); }
  .cmeta .chip.ro { cursor: default; }
  .cmeta .chip.ro:hover { background: none; color: var(--text2); }
  .cmeta .spacer { flex: 1; }
  .cmeta .wait { white-space: nowrap; color: var(--text2); }
  .cmeta .wait .dot { display: inline-block; margin-right: 5px; vertical-align: 1px; }
  #tip { position: fixed; z-index: 80; pointer-events: none; background: var(--round); color: var(--round-fg); font-size: 11.5px; font-weight: 500; padding: 4px 9px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.18); opacity: 0; transform: translateY(3px); transition: opacity .1s, transform .1s; }
  #tip.on { opacity: 1; transform: none; }
  [data-tip] { cursor: default; }
  #menu { position: fixed; z-index: 70; min-width: 180px; background: var(--toast); color: var(--text); border: 1px solid var(--input-line); border-radius: 10px; padding: 4px; box-shadow: 0 10px 28px rgba(0,0,0,.22); display: none; }
  #menu.on { display: block; }
  #menu button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
  #menu button:hover { background: var(--hover); }
  #menu .ck { width: 14px; color: var(--blue); }
  #menu .hd { font-size: 11px; color: var(--dim); padding: 6px 10px 2px; }
  .cbox textarea::placeholder { color: var(--dim); }
  .round { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--round); color: var(--round-fg); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .round:hover { filter: brightness(1.08); }
  .cmeta { display: flex; gap: 4px; align-items: center; margin: 6px 2px 0; font-size: 12.5px; color: var(--dim); min-height: 22px; }
  .cmeta .note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; font-size: 11.5px; }

  /* Main area: inbox or columns */
  #main { display: flex; min-width: 0; min-height: 0; overflow-x: auto; }
  .col { flex: 1 1 0; min-width: 260px; position: relative; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--bg); }
  .col:last-child { border-right: 0; }
  .col > header { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--line); }
  .col > header .title { flex: 1; font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col > .body { flex: 1; padding: 14px 16px 6px; }
  .meta { font-size: 11.5px; color: var(--dim); }
  .waitbox { margin: 10px 0 4px; color: var(--red); font-size: 13px; }
  .waitbox b { font-weight: 600; }
  .runbox { margin: 10px 0 4px; color: var(--orange); font-size: 12.5px; }
  .infobox { margin: 10px 0 4px; color: var(--text2); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 6px; }
  .label { font-size: 11.5px; color: var(--dim); margin: 18px 0 6px; }
  .msg { margin: 0 0 14px; }
  .msg .txt { white-space: pre-wrap; word-wrap: break-word; color: var(--text); }
  .msg.sen { display: flex; justify-content: flex-end; }
  .msg.sen .txt { background: var(--bubble); border-radius: 10px; padding: 7px 11px; max-width: 88%; }
  .msg code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); padding: 1px 4px; border-radius: 4px; }
  .item { display: block; padding: 8px 10px; }
  .item:hover { background: var(--hover); }
  .item .line { display: flex; align-items: center; gap: 8px; height: 20px; }
  .item .line .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .item .line .p { color: var(--dim); }
  .item .line .age { font-size: 11px; color: var(--dim); }
  .item .sub { font-size: 12.5px; margin: 2px 0 0 15px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .item .sub.red { color: var(--red); }
  .item .icon { visibility: hidden; }
  .item:hover .icon { visibility: visible; }
  .col[data-col="inbox"] > .body { padding: 0; display: flex; flex-direction: column; overflow: hidden; }
  .ibx-top { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .ibx-list { flex: 1; min-height: 0; overflow: auto; padding: 10px 12px; }
  #empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 13px; padding: 24px; text-align: center; }
  .col[data-col="harita"] > .body { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  /* the map is a canvas: drag to pan, pinch or wheel to zoom; it stays where it was left */
  .bigmap { flex: 1; min-height: 0; overflow: hidden; display: flex; justify-content: center; align-items: stretch; position: relative; cursor: grab; touch-action: none; background: var(--sky); }  /* the sky's colour fills the whole area, so panning never shows an edge */
  .bigmap.panning { cursor: grabbing; }
  /* hover: the circle under the pointer grows, nearby moons ease away, everything eases back on leave */
  .bigmap svg circle { transform-box: fill-box; transform-origin: center; }
  .bigmap svg line { transform-box: view-box; transform-origin: 0 0; }
  .bigmap svg [data-k] circle, .bigmap svg [data-k] text, .bigmap svg [data-k] line, .bigmap svg [data-p] circle { transition: transform .5s var(--spring); }
  /* session labels show only once the map is zoomed in, where they have room */
  .bigmap [data-k] text { opacity: 0; transition: opacity .2s; }
  .bigmap.zoomed [data-k] text { opacity: 1; }
  .mapview { height: 100%; flex: none; transform-origin: 0 0; will-change: transform; }
  .mapview svg { height: 100%; width: auto; display: block; }
  .maptools { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; z-index: 3; }
  .maptools button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--input-line); background: var(--input); color: var(--text2); display: inline-flex; align-items: center; justify-content: center; cursor: default; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .maptools button:hover { color: var(--text); background: color-mix(in srgb, var(--input), var(--text) 6%); }
  .maptools svg.i { width: 15px; height: 15px; }
  .col.mapfull { position: fixed; inset: 0; z-index: 55; width: auto !important; flex: none !important; border: 0; }
  .maplegend { flex: none; padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  select { height: 24px; border-radius: 6px; border: 0; background: var(--btn); color: var(--text2); padding: 0 6px; font-size: 12px; }

  /* Toast with undo */
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--toast); color: var(--text); border: 1px solid var(--input-line); box-shadow: 0 8px 24px rgba(0,0,0,.25);
    padding: 8px 8px 8px 14px; border-radius: 10px; display: none; align-items: center; gap: 12px; z-index: 9; max-width: 80vw; font-size: 12.5px; }
  #toast.on { display: flex; }

  @media (max-width: 760px) {
    html, body { overflow: auto; }
    #app { flex-direction: column; height: auto; min-height: 100vh; }
    #side, #plist.open, #plist .body, .pfoot { width: auto; }
    #tree { max-height: 40vh; }
    #main { flex-direction: column; overflow: visible; }
    .col { min-width: 0; border-right: 0; border-bottom: 1px solid var(--line); }
    .col > .body { max-height: 70vh; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side"><div class="rz" data-rz="side" title="Drag to resize"></div>
    <div id="brand"><img src="/icon.png" alt="" width="26" height="26"><div><div class="bname">Qosmos</div><div class="btag">Sessions map for Claude Code</div></div></div>
    <div id="head">
      <div id="counts">Scanning…</div>
      <div class="seg" id="days"></div>
      <div class="seg" id="themes"></div>
    </div>
    <div id="tree" class="scroll"></div>
    <div class="composer" id="sidebar-composer" data-to="home"></div>
  </aside>
  <div id="mapdock"></div>
  <section id="plist"><div class="rz" data-rz="plist" title="Drag to resize"></div><header></header><div class="meta"></div><div class="body scroll"></div><div class="pfoot"></div></section>
  <main id="main"></main>
</div>
<div id="menu"></div>
<div id="tip"></div>
<div id="toast"><span id="toast-text"></span><button class="btn" id="toast-undo">Undo</button></div>
<script>
'use strict'
try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('theme') || '"antrasit"') } catch { document.documentElement.dataset.theme = 'antrasit' }
const TOKEN = '__QOSMOS_TOKEN__'
const DAY = 86400000
const MAXCOLS = 4
const $ = s => document.querySelector(s)
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
const cut = (s, n) => (s = String(s ?? ''), s.length > n ? s.slice(0, n - 1) + '…' : s)
const keep = (k, v) => { try { v === undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)) } catch {} }
const kept = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } }
const I = (d, cls = '') => `<svg class="i ${cls}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
const ICON = {
  right: I('<path d="M6 4l4 4-4 4"/>'), down: I('<path d="M4 6l4 4 4-4"/>'), x: I('<path d="M4 4l8 8M12 4l-8 8"/>'),
  mic: I('<rect x="6" y="2" width="4" height="8" rx="2"/><path d="M3.5 8a4.5 4.5 0 009 0M8 12.5V14"/>', 'mic'),
  send: I('<path d="M8 13V3M4 7l4-4 4 4"/>', 'send'), plus: I('<path d="M8 3v10M3 8h10"/>'), refresh: I('<path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/>'), expand: I('<path d="M9.5 2.5h4v4M13.5 2.5L9 7M6.5 13.5h-4v-4M2.5 13.5L7 9"/>'), shrink: I('<path d="M13.5 6.5h-4v-4M9.5 6.5L14 2M2.5 9.5h4v4M6.5 9.5L2 14"/>'), more: '<svg class="i" viewBox="0 0 16 16" fill="currentColor"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>', app: I('<path d="M9 3h4v4M13 3L7 9M11 9v4H3V5h4"/>'), check: I('<path d="M3 8.5l3 3 7-7"/>'),
  archive: I('<rect x="2.5" y="3" width="11" height="3" rx="1"/><path d="M3.5 6v7h9V6M6.5 9h3"/>'),
}

// On a first visit the map and the inbox are open.
const S = { data: null, days: kept('days', 7), open: new Set(kept('open', [])), pp: kept('pp', ''), cols: kept('cols', ['harita', 'inbox']).filter(c => !c.startsWith('p:')), sel: '', tab: 'bekleyen', filter: 'hepsi', proj: '', talks: {}, jobs: {}, confirmOld: false }

async function api(path, body) {
  const r = await fetch(path, body === undefined
    ? { headers: { 'X-Qosmos-Token': TOKEN } }
    : { method: 'POST', headers: { 'X-Qosmos-Token': TOKEN, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
  const d = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(d.error || r.status)
  return d
}
function toast(t, undo, ms = 6000) {
  $('#toast-text').textContent = tr(t)
  $('#toast-undo').style.display = undo ? '' : 'none'
  $('#toast-undo').onclick = () => { $('#toast').classList.remove('on'); undo && undo() }
  $('#toast').classList.add('on')
  clearTimeout(toast.h); toast.h = setTimeout(() => $('#toast').classList.remove('on'), ms)
}

// --- status rules: red = the owner must act, orange = the agent works
const waiting = k => !!k.ask || (k.cat === 'blocked' && !k.busy)
const running = k => !!k.busy && !k.ask
const readAt = id => S.data?.readAt?.[id] ?? 0
const unread = k => Math.max(k.seen, readAt(k.id)) < k.last - 1000
// Blue, like Claude's sidebar: a reply you have not read, from the last 24 hours
const fresh = k => !waiting(k) && !running(k) && unread(k) && Date.now() - k.last < DAY
const ago = ms => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 60 ? `${m}m` : m < 2880 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d` }
const visible = () => (S.data?.sessions ?? []).filter(k => S.days === 0 || Date.now() - k.last < S.days * DAY || (waiting(k) && Date.now() - k.last < 30 * DAY))
const dot = k => `<span class="dot${waiting(k) ? ' r' : running(k) ? ' o' : fresh(k) ? ' b' : !unread(k) ? '' : ' u'}" data-tip="${waiting(k) ? 'Waiting for you' : running(k) ? 'Agent working' : fresh(k) ? 'New reply in the last 24 hours' : unread(k) ? 'Unread reply' : 'Nothing new'}"></span>`
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`
const accLabel = acc => { const a = S.data.accounts; return `H${a.indexOf(acc) + 1}${acc === S.data.current ? '' : ' · other account'}` }
const byId = () => new Map((S.data?.sessions ?? []).map(k => [k.id, k]))
const LOOSE = new Set(['No folder', '~'])  // sessions started from + New, with no project folder
const pos = n => { const i = (S.data?.order ?? []).indexOf(n); return i < 0 ? 1e6 : i }
function groups() {
  const g = new Map()
  for (const k of visible()) g.set(k.proj, [...(g.get(k.proj) ?? []), k])
  const auto = (a, b) => b[1].filter(waiting).length - a[1].filter(waiting).length || Math.max(...b[1].map(k => k.last)) - Math.max(...a[1].map(k => k.last))
  return [...g.entries()].sort((a, b) => pos(a[0]) - pos(b[0]) || auto(a, b))
}

// --- the sky: planets are projects, moons their topics; every circle is clickable
function layout(gs) {
  const planets = gs.map(([name, list]) => {
    const moons = [...list].sort((a, b) => b.last - a.last).slice(0, 24)
    const r = Math.min(48, 16 + 5 * Math.sqrt(list.length) + (list.some(k => k.star) ? 4 : 0))
    return { name, list, moons, r, outer: r + 22 + (moons.length > 12 ? 18 : 0) + 10, x: 0, y: 0 }
  }).sort((a, b) => b.outer - a.outer)
  const placed = []
  for (const p of planets) {
    for (let t = 0; ; t++) {
      const a = t * 0.45, d = t * 3, x = Math.cos(a) * d, y = Math.sin(a) * d * 0.75
      if (placed.every(q => Math.hypot(q.x - x, q.y - y) >= q.outer + p.outer + 18)) { p.x = x; p.y = y; break }
    }
    placed.push(p)
  }
  return placed
}
function sky(gs, { labels = true } = {}) {
  const ps = layout(gs)
  if (!ps.length) return ''
  const minX = Math.min(...ps.map(p => p.x - p.outer)) - 20, maxX = Math.max(...ps.map(p => p.x + p.outer)) + 20
  const minY = Math.min(...ps.map(p => p.y - p.outer)) - 20, maxY = Math.max(...ps.map(p => p.y + p.outer)) + 34
  const sel = S.sel
  const blink = '<animate attributeName="opacity" values="1;0.15;1" dur="0.9s" repeatCount="indefinite"/>'
  const o = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX | 0} ${minY | 0} ${(maxX - minX) | 0} ${(maxY - minY) | 0}" preserveAspectRatio="xMidYMid meet">`,
    `<rect x="${minX | 0}" y="${minY | 0}" width="${(maxX - minX) | 0}" height="${(maxY - minY) | 0}" fill="var(--sky)"/>`]
  for (const p of ps) {
    const nWait = p.list.filter(waiting).length, anyRun = p.list.some(running)
    const ring1 = p.r + 22, ring2 = ring1 + 18
    o.push(`<circle cx="${p.x}" cy="${p.y}" r="${ring1}" fill="none" stroke="var(--orbit)" stroke-width="0.8"/>`)
    if (p.moons.length > 12) o.push(`<circle cx="${p.x}" cy="${p.y}" r="${ring2}" fill="none" stroke="var(--orbit)" stroke-width="0.8"/>`)
    p.moons.forEach((k, i) => {
      const inner = p.moons.length <= 12 || i < 12, n = inner ? Math.min(12, p.moons.length) : p.moons.length - 12, j = inner ? i : i - 12
      const a = -Math.PI / 2 + (j / n) * Math.PI * 2 + (inner ? 0 : Math.PI / n), R = inner ? ring1 : ring2
      const mx = +(p.x + Math.cos(a) * R).toFixed(1), my = +(p.y + Math.sin(a) * R).toFixed(1)
      const ex = +(p.x + Math.cos(a) * p.r).toFixed(1), ey = +(p.y + Math.sin(a) * p.r).toFixed(1)
      const mr = +(3 + Math.min(5, Math.sqrt(k.turns) / 1.4)).toFixed(1)
      const w = waiting(k), run = running(k), isNew = fresh(k)
      const fill = w ? 'var(--red)' : run ? 'var(--orange)' : isNew ? 'var(--blue)' : 'var(--grey)'
      // closed moons have no ring and fade 10% a day after their last activity, gone after ten days
      const fade = w || run || isNew ? 1 : Math.max(0, 1 - (Date.now() - k.last) / (10 * DAY))
      const tip = `${p.name} · ${k.title}\n${w ? 'WAITING FOR YOU' : run ? 'Agent working' : isNew ? 'New reply' : 'Closed'} · ${ago(k.last)} ago${k.need ? '\n' + k.need : ''}`
      o.push(`<g data-k="${esc(k.id)}" data-c="${mx},${my}" data-l="${ex},${ey}" opacity="${fade.toFixed(2)}"><title>${esc(tip)}</title>`)
      o.push(`<line x1="${ex}" y1="${ey}" x2="${mx}" y2="${my}" stroke="${w ? 'var(--red)' : run ? 'var(--orange)' : 'var(--mline)'}" stroke-width="${w || run ? 0.9 : 0.6}"/>`)
      o.push(`<circle cx="${mx}" cy="${my}" r="${mr + 7}" fill="transparent"/>`)
      if (w) o.push(`<circle cx="${mx}" cy="${my}" r="${mr + 5}" fill="var(--red)" opacity="0.45"><animate attributeName="opacity" values="0.5;0;0.5" dur="0.9s" repeatCount="indefinite"/></circle>`)
      if (run) o.push(`<circle cx="${mx}" cy="${my}" r="${mr + 6}" fill="var(--orange)" opacity="0.35"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="2s" repeatCount="indefinite"/></circle>`)
      if (k.id === sel) o.push(`<circle cx="${mx}" cy="${my}" r="${mr + 3.5}" fill="none" stroke="var(--blue)" stroke-width="1.6"/>`)
      o.push(`<circle cx="${mx}" cy="${my}" r="${mr}" fill="${fill}">${w ? blink : ''}</circle>`)
      // like the planets' names: the first four words of the session, small, on two lines, outside the moon
      const words = String(k.title || '').split(/\s+/).filter(Boolean), clip = t => (t.length > 16 ? t.slice(0, 15) + '…' : t)
      const l1 = clip(words.slice(0, 2).join(' ')), l2 = clip(words.slice(2, 4).join(' ') + (words.length > 4 ? '…' : ''))
      const cx2 = Math.cos(a), cy2 = Math.sin(a), lx = +(mx + cx2 * (mr + 5)).toFixed(1), ly = +(my + cy2 * (mr + 5)).toFixed(1)
      const anchor = cx2 > 0.35 ? 'start' : cx2 < -0.35 ? 'end' : 'middle', top = cy2 < -0.35 ? ly - 7 : cy2 > 0.35 ? ly + 3 : ly - 2
      o.push(`<text x="${lx}" y="${top}" text-anchor="${anchor}" font-size="5.5" fill="var(--label)" style="pointer-events:none"><tspan x="${lx}">${esc(l1)}</tspan>${l2 ? `<tspan x="${lx}" dy="6.5">${esc(l2)}</tspan>` : ''}</text></g>`)
    })
    o.push(`<g data-p="${esc(p.name)}" data-c="${p.x},${p.y},${p.r}"><title>${esc(`${p.name}: ${p.list.length} sessions · ${nWait} waiting for you`)}</title>`)
    if (nWait) o.push(`<circle cx="${p.x}" cy="${p.y}" r="${p.r + 6}" fill="none" stroke="var(--red)" stroke-width="2.5">${blink}</circle>`)
    else if (anyRun) o.push(`<circle cx="${p.x}" cy="${p.y}" r="${p.r + 6}" fill="none" stroke="var(--orange)" stroke-width="2"/>`)
    const lively = p.list.some(k => Date.now() - k.last < 7 * DAY)
    o.push(`<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${lively ? 'var(--planet)' : 'var(--planet-dim)'}"/>`)
    o.push(`<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--planet-text)">${p.list.length}</text>`)
    if (labels) o.push(`<text x="${p.x}" y="${p.y + p.outer + 4}" text-anchor="middle" font-size="12" fill="var(--label)">${esc(p.name)}</text>`)
    o.push('</g>')
  }
  o.push('</svg>')
  return o.join('')
}
function onSkyClick(e, fallback) {
  const m = e.target.closest('[data-k]'), p = e.target.closest('[data-p]')
  if (m) return openCol('k:' + m.dataset.k)
  if (p) return pickProject(p.dataset.p)
  if (fallback) fallback()
}

// --- columns: 'k:<session>', 'p:<project>', 'home' (the Qosmos session), 'harita'
function openCol(c) {
  if (c.startsWith('k:')) { S.sel = c.slice(2); loadTalk(c.slice(2)); const k = byId().get(S.sel); if (k && S.pp !== k.proj) { S.pp = k.proj; keep('pp', k.proj) } }
  if (c === 'home') loadTalk('home')
  if (!S.cols.includes(c)) {
    // the map always sits first, right of the sidebar; when columns run out, the oldest session goes, never the map
    const cols = c === 'harita' ? [c, ...S.cols] : [...S.cols, c]
    while (cols.length > MAXCOLS) cols.splice(cols.findIndex(x => x !== 'harita'), 1)
    S.cols = cols
  }
  keep('cols', S.cols); render()
  requestAnimationFrame(() => document.querySelector(`[data-col="${CSS.escape(c)}"]`)?.scrollIntoView({ inline: 'nearest', behavior: 'smooth' }))
}
function pickProject(name) { S.pp = name; keep('pp', name || undefined); render() }
function closeCol(c) { S.cols = S.cols.filter(x => x !== c); keep('cols', S.cols); render() }
async function loadTalk(id) {
  try { S.talks[id] = (await api('/api/konu?id=' + encodeURIComponent(id))).msgs ?? [] } catch { S.talks[id] = [] }
  renderCols()
}
// Closing is always undoable for a few seconds, so a stray click costs nothing.
async function closeTopic(k) {
  try {
    const r = await api('/api/close', { id: k.id })
    S.cols = S.cols.filter(c => c !== 'k:' + k.id); keep('cols', S.cols)
    if (r.job) S.jobs[r.job] = { label: `Archive: ${cut(k.title, 30)}`, at: Date.now() }
    toast(`“${cut(k.title, 40)}” closed`, () => api('/api/reopen', { id: k.id }).then(x => { S.jobs[x.job] = { label: 'Reopen', at: Date.now() }; refresh(true) }))
    await refresh(true)
  } catch (err) { toast('Could not close: ' + err.message) }
}
async function markRead(k) { await api('/api/read', { id: k.id }).catch(() => {}); await refresh(true) }
async function openInApp(k) {
  await api('/api/read', { id: k.id }).catch(() => {})
  try { await api('/api/open', { id: k.id }); if (k.acc !== S.data.current) toast('This session belongs to another account; it opens once you sign in with that account.') } catch (err) { toast('Could not open: ' + err.message) }
}

// --- rendering
function setHTML(el, html) { if (el._html === html) return false; el.innerHTML = html; el._html = html; return true }
const md = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
function render() { renderSide(); renderPlist(); renderCols() }
function renderSide() {
  const d = S.data
  if (!d || S.drag) return
  const shown = visible(), w = shown.filter(waiting).length, r = shown.filter(running).length, n = shown.filter(k => !waiting(k) && !running(k) && unread(k)).length
  setHTML($('#counts'), `<span class="w"><b>${w}</b> waiting</span><span class="o"><b>${r}</b> running</span><span><b>${n}</b> unread</span>`)
  const th = document.documentElement.dataset.theme
  setHTML($('#days'), [1, 7, 30, 0].map(x => `<button data-days="${x}" class="${S.days === x ? 'on' : ''}">${x ? x + (x === 1 ? ' day' : ' days') : 'All'}</button>`).join(''))
  setHTML($('#themes'), [['antrasit', 'Graphite'], ['acik', 'Light'], ['siyah', 'Black']].map(([v, l]) => `<button data-theme-pick="${v}" class="${th === v ? 'on' : ''}">${l}</button>`).join(''))
  const tree = groups().filter(([name]) => !LOOSE.has(name)).map(([name, list]) => {
    const lw = list.filter(waiting).length, lr = list.filter(running).length, on = S.pp === name
    return `<div class="row proj${on ? ' on' : ''}${lw ? ' sw' : lr ? ' sr' : ''}" data-proj="${esc(name)}" data-drag="${esc(name)}"><span class="dot${lw ? ' r' : lr ? ' o' : list.some(fresh) ? ' b' : ''}" data-tip="${lw ? 'Waiting for you' : lr ? 'Agent working' : list.some(fresh) ? 'New reply in the last 24 hours' : 'Nothing new'}"></span><span class="name" data-tip="${esc(name)} · ${plural(list.length, 'session')} ${S.days ? `in the last ${plural(S.days, 'day')}` : 'in total'}${lw ? ` · ${lw} waiting for you` : ''}${lr ? ` · ${lr} running` : ''}">${esc(name)}</span>${lw ? `<span class="badge r" data-tip="${plural(lw, 'session')} waiting for you">${lw}</span>` : ''}${lr ? `<span class="badge o" data-tip="${plural(lr, 'session')} running">${lr}</span>` : ''}<span class="badge" data-tip="${plural(list.length, 'session')} ${S.days ? `in the last ${plural(S.days, 'day')}` : 'in total'}">${list.length}</span><button class="more" data-tip="More options">${ICON.more}</button></div>`
  }).join('')
  const hidden = d.hidden ?? []
  const closed = hidden.length ? `<div class="section">Closed</div><div class="row proj" data-closed="1"><span class="chev">${S.open.has('__kapali') ? ICON.down : ICON.right}</span><span class="name dim">${hidden.length} sessions</span></div>` +
    (S.open.has('__kapali') ? [...hidden].reverse().map(h => `<div class="row sub"><span class="name dim">${esc(h.proj)} · ${esc(h.title)}</span><button class="btn" data-reopen="${esc(h.id)}">Reopen</button></div>`).join('') : '') : ''
  const custom = (d.order ?? []).length ? '<button class="linkbtn" data-act="autosort" title="Reset the order: waiting and most recent first">auto-sort</button>' : ''
  const loose = visible().filter(k => LOOSE.has(k.proj)).sort((a, b) => pos('k:' + a.id) - pos('k:' + b.id) || Number(waiting(b)) - Number(waiting(a)) || b.last - a.last)
  const looseRows = loose.map(k => `<div class="row proj${S.cols.includes('k:' + k.id) ? ' on' : ''}${waiting(k) ? ' sw' : running(k) ? ' sr' : ''}" data-open="k:${esc(k.id)}" data-drag="k:${esc(k.id)}" title="${esc(k.title)}">${dot(k)}<span class="name">${esc(k.title)}</span><span class="age">${ago(k.last)}</span><button class="more" data-tip="More options">${ICON.more}</button></div>`).join('')
  setHTML($('#tree'), `<div class="section">Projects ${custom}</div><div class="group">${tree}</div>${loose.length ? `<div class="section">Loose sessions</div><div class="group">${looseRows}</div>` : ''}<div class="section">Qosmos</div><div class="row${S.cols.includes('home') ? ' on' : ''}" data-open="home"><span class="dot" style="background:var(--blue)"></span><span class="name">Home session (Claude)</span></div><div class="row${S.cols.includes('harita') ? ' on' : ''}" data-open="harita"><span class="dot" style="background:var(--planet-dim)"></span><span class="name">Map</span></div><div class="row${S.cols.includes('inbox') ? ' on' : ''}" data-open="inbox"><span class="dot${visible().some(waiting) ? ' r' : ''}"></span><span class="name">Inbox</span>${visible().filter(waiting).length ? `<span class="badge r" style="margin-left:auto">${visible().filter(waiting).length}</span>` : ''}</div>${closed}`)
  fillMeta($('#sidebar-composer'), true)
}
function renderPlist() {
  const el = $('#plist'), list = new Map(groups()).get(S.pp)
  el.classList.toggle('open', !!list)
  if (!list) return
  const sorted = [...list].sort((a, b) => Number(waiting(b)) - Number(waiting(a)) || Number(running(b)) - Number(running(a)) || b.last - a.last)
  setHTML(el.querySelector('header'), `<span class="title">${esc(S.pp)}</span><button class="icon" data-plx="1" title="Close panel">${ICON.x}</button>`)
  setHTML(el.querySelector('.meta'), `<span class="meta" style="padding:0">${list.length} sessions · <span class="red">${list.filter(waiting).length} waiting</span> · <span style="color:var(--orange)">${list.filter(running).length} running</span></span>`)
  const pw = list.filter(waiting)
  setHTML(el.querySelector('.pfoot'), `<button class="btn" data-pact="waiting"${pw.length ? '' : ' disabled'}>Open waiting sessions (${pw.length})</button><button class="btn" data-pact="read">Mark all as read</button>`)

// --- resizable panels: the sidebar, the project panel and every column, by the strip on their right edge.
// Widths are a per-browser preference. A resized column keeps its width; the last one always takes what is left.
const W = kept('widths', {})
function applyWidths() {
  if (W.side) document.documentElement.style.setProperty('--side-w', W.side + 'px')
  if (W.plist) document.documentElement.style.setProperty('--plist-w', W.plist + 'px')
  const cols = [...document.querySelectorAll('#main > .col')]
  cols.forEach((el, i) => { const w = i < cols.length - 1 && W['col:' + el.dataset.col]; el.style.flex = w ? `0 0 ${w}px` : '' })
  // Safari sizes a flex box by its content (the map's own width); pin the dock to the column's width instead
  const dock = $('#mapdock'), docked = dock.querySelector('.col'), dw = W['col:harita'] || 460
  if (docked) docked.style.flex = `0 0 ${dw}px`
  dock.style.width = docked ? dw + 'px' : '0px'
}
let rz = null
document.addEventListener('pointerdown', e => {
  const h = e.button === 0 && e.target.closest('.rz'); if (!h) return
  e.preventDefault(); e.stopPropagation()
  const panel = h.parentElement, next = h.dataset.rz === 'col' ? panel.nextElementSibling : null
  rz = { h, kind: h.dataset.rz, panel, next, x: e.clientX, w: panel.getBoundingClientRect().width, nw: next?.getBoundingClientRect().width ?? 0 }
  h.classList.add('on'); document.body.classList.add('resizing')

  if (!rz) return
  const dx = e.clientX - rz.x

  else if (rz.kind === 'plist') { W.plist = Math.round(Math.max(240, Math.min(640, rz.w + dx))); document.documentElement.style.setProperty('--plist-w', W.plist + 'px') }
  else {
    // trade width with the neighbour on the right, neither below 260 px
    const d = rz.next ? Math.max(260 - rz.w, Math.min(rz.nw - 260, dx)) : Math.max(260 - rz.w, dx)
    W['col:' + rz.panel.dataset.col] = Math.round(rz.w + d)
    rz.panel.style.flex = `0 0 ${Math.round(rz.w + d)}px`
    if (rz.panel.parentElement.id === 'mapdock') rz.panel.parentElement.style.width = Math.round(rz.w + d) + 'px'
    const last = rz.next && !rz.next.nextElementSibling
    if (rz.next && !last) { W['col:' + rz.next.dataset.col] = Math.round(rz.nw - d); rz.next.style.flex = `0 0 ${Math.round(rz.nw - d)}px` }

function translateDOM() {
  document.documentElement.lang = LANG

  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => {
    const p = n.parentElement
    if (!p || (p.closest(USER_TEXT) && !p.matches('.waitbox > b'))) return NodeFilter.FILTER_REJECT
    if (p.closest('svg') && p.tagName.toLowerCase() !== 'title') return NodeFilter.FILTER_REJECT
    return NodeFilter.FILTER_ACCEPT
  } })
  for (let n = walk.nextNode(); n; n = walk.nextNode()) {
    // project and session names are the owner's own words: only the few UI rows that live in a name slot are translated
    const p = n.parentElement, inName = p.closest('.name, .t, .p, .title')
    if (inName && !NAME_UI.has(n.nodeValue.trim()) && !/^\d+ sessions?$/.test(n.nodeValue.trim())) continue
    const v = tr(n.nodeValue)

  for (const el of document.querySelectorAll('[placeholder], [title], [data-tip]')) {
    if (el.matches('.row, .item')) continue  // their title is a session's own name
    for (const a of ['placeholder', 'title', 'data-tip']) { const v = el.getAttribute(a); if (v) { const t = tr(v); if (t !== v) el.setAttribute(a, t) } }

  MENU = []

// --- composers: the sidebar one talks to the home session, a column's to its topic (a project column: home, prefixed)
async function send(comp) {
  const box = comp.querySelector('textarea'), text = box.value.trim(), to = comp.dataset.to, note = comp.querySelector('.note')
  if (!text) return
  const k = to.startsWith('k:') ? byId().get(to.slice(2)) : null
  const body = to.startsWith('p:') ? `[${to.slice(2)}] ${text}` : text
  try {
    const r = await api('/api/send', { id: k ? k.id : '', text: body })
    S.jobs[r.job] = { label: k ? cut(k.title, 30) : 'Claude', at: Date.now(), note }
    box.value = ''; grow(box); comp.classList.remove('has-text')
    note.textContent = 'Sending…'
    const tid = k ? k.id : 'home'
    if (!k && !S.cols.includes('home')) openCol('home')
    S.talks[tid] = [...(S.talks[tid] ?? []), { role: 'sen', text: body }]; renderCols()
    for (const ms of [4000, 10000, 20000, 40000]) setTimeout(() => loadTalk(tid), ms)
    setTimeout(() => refresh(true), 3000)
  } catch (err) { note.textContent = 'Could not send: ' + err.message }
}
const grow = t => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px' }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition
let rec = null
function mic(comp) {
  if (!SR) return toast('Speech recognition is not available in this browser. Press 🌐 (fn) twice in the text field to use macOS dictation.')
  if (rec) { const same = rec.comp === comp; rec.stop(); if (same) return }
  const box = comp.querySelector('textarea'), base = box.value ? box.value + ' ' : ''
  const r = new SR(); r.lang = navigator.language || 'en-US'; r.interimResults = true; r.continuous = true; r.comp = comp
  r.onresult = e => { box.value = base + [...e.results].map(x => x[0].transcript).join(''); grow(box) }
  r.onend = () => { if (rec === r) rec = null; comp.classList.remove('rec'); comp.classList.toggle('has-text', !!box.value.trim()) }
  r.onerror = e => toast('Microphone: ' + e.error)
  rec = r; r.start(); comp.classList.add('rec'); box.focus()
}

  const more = t.closest('.row .more'); if (more) { e.stopPropagation(); return rowMenu(more.closest('.row'), more) }
  const proj = t.closest('[data-proj]'); if (proj) return pickProject(S.pp === proj.dataset.proj ? '' : proj.dataset.proj)

  }

  const act = t.closest('[data-act]'); if (act) {

// Classic list drag: the row lifts with a shadow and follows the pointer (tilting a little with sideways speed),
// the other rows slide aside to open the slot, and on release it settles into place. Under 4 px it stays a click; Esc cancels.
let pdrag = null
document.addEventListener('pointerdown', e => {
  const r = e.button === 0 && !e.target.closest('.more') && e.target.closest('.row[data-drag]'); if (!r) return
  pdrag = { row: r, name: r.dataset.drag, x0: e.clientX, y0: e.clientY, moved: false }
})
function dragStart(e) {
  const d = pdrag, rows = [...d.row.parentElement.querySelectorAll('.row[data-drag]')]
  d.rows = rows; d.from = rows.indexOf(d.row); d.to = d.from
  d.rects = rows.map(r => r.getBoundingClientRect()); d.h = d.rects[d.from].height
  d.step = rows.length > 1 ? d.rects[1].top - d.rects[0].top : d.h
  d.dx = d.x0 - d.rects[d.from].left; d.dy = d.y0 - d.rects[d.from].top
  d.vx = 0; d.lastX = e.clientX; d.tilt = 0
  const g = d.ghost = d.row.cloneNode(true)
  g.classList.add('drag-ghost'); g.classList.remove('on')
  Object.assign(g.style, { width: d.rects[d.from].width + 'px', left: d.rects[d.from].left + 'px', top: d.rects[d.from].top + 'px' })
  document.body.append(g)
  requestAnimationFrame(() => g.classList.add('lifted'))
  d.row.classList.add('drag-hole')
  rows.forEach(r => r !== d.row && r.classList.add('drag-shift'))

}
function dragMove(e) {

  d.vx = d.vx * 0.7 + (e.clientX - d.lastX) * 0.3; d.lastX = e.clientX
  d.tilt = Math.max(-5, Math.min(5, d.vx * 0.6))
  d.ghost.style.left = (e.clientX - d.dx) + 'px'; d.ghost.style.top = (e.clientY - d.dy) + 'px'
  d.ghost.style.setProperty('--tilt', d.tilt.toFixed(2) + 'deg')
  // the slot: how many of the other rows have their middle above the lifted row's middle
  const mid = e.clientY - d.dy + d.h / 2
  let to = 0
  d.rects.forEach((r, i) => { if (i !== d.from && r.top + r.height / 2 < mid) to++ })
  if (to === d.to) return
  d.to = to
  d.rows.forEach((r, i) => {
    if (i === d.from) return
    const shift = d.from < to && i > d.from && i <= to ? -d.step : d.from > to && i >= to && i < d.from ? d.step : 0
    r.style.transform = shift ? `translateY(${shift}px)` : ''
  })

  d.ghost.style.setProperty('--tilt', '0deg')
  d.ghost.style.left = slot.left + 'px'; d.ghost.style.top = (commit && d.to > d.from ? d.rects[d.to].top : slot.top) + 'px'
  document.body.classList.remove('grabbing')
  S.justDragged = true; setTimeout(() => (S.justDragged = false), 0)
  setTimeout(() => {
    d.ghost.remove()
    d.rows.forEach(r => { r.classList.remove('drag-shift', 'drag-hole'); r.style.transform = '' })
    S.drag = null
    if (!commit || d.to === d.from) return renderSide()
    const names = d.rows.map(r => r.dataset.drag)
    names.splice(d.to, 0, names.splice(d.from, 1)[0])
    const rest = (S.data.order ?? []).filter(n => !names.includes(n))  // projects hidden by the day filter keep their place after
    saveOrder([...names, ...rest])
  }, 320)
}

  dragMove(e)

document.addEventListener('input', e => { if (e.target.matches('.composer textarea')) { grow(e.target); e.target.closest('.composer').classList.toggle('has-text', !!e.target.value.trim()) } })
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.target.matches('.composer textarea')) { e.preventDefault(); send(e.target.closest('.composer')) } })
document.addEventListener('change', e => { if (e.target.id === 'projsel') { S.proj = e.target.value; renderCols() } })
$('#app').addEventListener('click', e => {
  const tool = e.target.closest('[data-map]')
  if (tool) return tool.dataset.map === 'reset' ? resetMapView() : toggleMapFull()
  if (e.target.closest('.bigmap') && !S.justDragged) onSkyClick(e)
})
// --- the map canvas: pan by dragging, zoom by pinch (Chrome: ctrl+wheel, Safari: gesture events) or the wheel,
// around the pointer. The view is kept across refreshes and reloads; ↻ centres it again at 1×.
const MV = Object.assign({ x: 0, y: 0, s: 1 }, kept('mapView', {}))
// Hover lens: the circle under the pointer scales up; moons within reach slide away from it, their line kept
// attached to the planet (the line turns and stretches about its planet end). Leaving resets, and CSS eases it all.
let hovG = null
function hoverMap(g) {
  if (g === hovG) return
  hovG = g
  const svg = document.querySelector('.bigmap svg'); if (!svg) return
  const moons = [...svg.querySelectorAll('[data-k]')]
  svg.querySelectorAll('[data-k] circle, [data-k] text, [data-k] line, [data-p] circle').forEach(el => (el.style.transform = ''))
  if (!g) return
  const [hx, hy, hr] = g.dataset.c.split(',').map(Number), isPlanet = 'p' in g.dataset
  g.querySelectorAll('circle').forEach(el => (el.style.transform = `scale(${isPlanet ? 1.12 : 1.8})`))
  const reach = isPlanet ? hr + 70 : 90, push = isPlanet ? 16 : 13
  for (const m of moons) {
    if (m === g) continue
    const [mx, my] = m.dataset.c.split(',').map(Number), [lx, ly] = m.dataset.l.split(',').map(Number)
    const vx = mx - hx, vy = my - hy, d = Math.hypot(vx, vy) || 1
    if (d >= reach) continue
    const f = (1 - d / reach) * push, dx = vx / d * f, dy = vy / d * f
    m.querySelectorAll('circle, text').forEach(el => (el.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px)`))
    const ln = m.querySelector('line'); if (!ln) continue
    const ux = mx - lx, uy = my - ly, nx = ux + dx, ny = uy + dy
    const sc = Math.hypot(nx, ny) / (Math.hypot(ux, uy) || 1), th = Math.atan2(ny, nx) - Math.atan2(uy, ux)
    ln.style.transform = `translate(${lx}px, ${ly}px) rotate(${th.toFixed(4)}rad) scale(${sc.toFixed(4)}) translate(${-lx}px, ${-ly}px)`
  }
}
document.addEventListener('mouseover', e => {
  if (mpan?.moved) return
  hoverMap(e.target.closest ? e.target.closest('.bigmap [data-k], .bigmap [data-p]') : null)
})
function applyMapView() {
  hovG = null  // a redraw replaced the circles
  const v = document.querySelector('.mapview'); if (!v) return
  v.style.transform = `translate(${MV.x}px, ${MV.y}px) scale(${MV.s})`
  v.parentElement.classList.toggle('zoomed', MV.s >= 1.5)
}
const saveMapView = () => keep('mapView', { x: Math.round(MV.x), y: Math.round(MV.y), s: +MV.s.toFixed(3) })
function resetMapView() {
  const v = document.querySelector('.mapview')
  if (v) { v.style.transition = 'transform .6s var(--spring)'; setTimeout(() => (v.style.transition = ''), 650) }
  MV.x = 0; MV.y = 0; MV.s = 1; applyMapView(); saveMapView(); refresh(true)
}
function zoomMapAt(clientX, clientY, factor) {
  const v = document.querySelector('.mapview'), box = v?.parentElement.getBoundingClientRect(); if (!v) return
  const s = Math.max(0.3, Math.min(6, MV.s * factor)), k = s / MV.s
  const px = clientX - box.left - v.offsetLeft, py = clientY - box.top - v.offsetTop  // pointer in the view's untransformed frame
  MV.x = px - (px - MV.x) * k; MV.y = py - (py - MV.y) * k; MV.s = s
  applyMapView(); saveMapView()
}
function toggleMapFull() {
  const col = document.querySelector('[data-col="harita"]'); if (!col) return
  col.classList.toggle('mapfull'); renderCols()
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.col.mapfull')) toggleMapFull() })
let mpan = null
document.addEventListener('pointerdown', e => {
  const m = e.button === 0 && e.target.closest('.bigmap'); if (!m || e.target.closest('.maptools')) return
  mpan = { x0: e.clientX, y0: e.clientY, x: MV.x, y: MV.y, moved: false, el: m }
})
document.addEventListener('pointermove', e => {
  if (!mpan) return
  const dx = e.clientX - mpan.x0, dy = e.clientY - mpan.y0
  if (!mpan.moved && Math.hypot(dx, dy) < 4) return
  mpan.moved = true; mpan.el.classList.add('panning')
  MV.x = mpan.x + dx; MV.y = mpan.y + dy; applyMapView()
})
document.addEventListener('pointerup', () => {
  if (!mpan) return
  if (mpan.moved) { saveMapView(); S.justDragged = true; setTimeout(() => (S.justDragged = false), 0) }
  mpan.el.classList.remove('panning'); mpan = null
})
document.addEventListener('wheel', e => {
  if (!e.target.closest || !e.target.closest('.bigmap')) return
  e.preventDefault()
  zoomMapAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)))
}, { passive: false })
let gScale = 1
document.addEventListener('gesturestart', e => { if (e.target.closest && e.target.closest('.bigmap')) { e.preventDefault(); gScale = 1 } })
document.addEventListener('gesturechange', e => {
  if (!e.target.closest || !e.target.closest('.bigmap')) return
  e.preventDefault(); zoomMapAt(e.clientX, e.clientY, e.scale / gScale); gScale = e.scale
})
$('#sidebar-composer').innerHTML = composerHTML('Message Claude… (home session)')

// --- data: sessions every 10 s, open conversations every 15 s; bridge results show under the bar that sent them
async function refresh(now) {
  try { S.data = await api('/api/scan' + (now ? '?t=' + Date.now() : '')); if (S.data.lang) LANG = /^tr/i.test(S.data.lang) ? 'tr' : 'en' } catch (err) { $('#counts').textContent = 'Cannot reach the server: ' + err.message; return }
  for (const [job, j] of Object.entries(S.jobs)) {
    const r = S.data.results?.[job], out = j.note?.isConnected ? j.note : $('#sidebar-composer .note')
    if (r) { out.textContent = r.ok ? `✓ delivered · ${j.label}` : `✗ not delivered · ${j.label}: ${r.text}`; delete S.jobs[job] }
    else if (Date.now() - j.at > 20000) { out.textContent = `${j.label}: the bridge is not answering. Is the home session open?`; delete S.jobs[job] }
  }
  render()
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {})
refresh()
setInterval(refresh, 10000)
const talkIds = () => S.cols.filter(c => c.startsWith('k:') || c === 'home').map(c => (c === 'home' ? 'home' : c.slice(2)))
setInterval(() => talkIds().forEach(loadTalk), 15000)
talkIds().forEach(loadTalk)
</script>
